<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Dean Log In</title>
    <link rel="icon" type="image/x-icon" href="pictures/NORMI Logo-white-bg.png">
    <link rel="stylesheet" href="css\LogInPage.css"> 
    <script src="js/jquery-3.7.1.js"></script>
    <script src="js/deanLogin.js" defer></script>
</head>
<body>
    <div class="logo-content">
        <img src="..\pictures\NORMI Logo-white-bg.png" alt="">
    </div>
    <div class="log-in-content">
        <form id="form-dean" class="form dean" action="LogIn.php" method="post">
            <div class="log-in-header" id="log-in-header">Log In</div>
            <div class="input-controller">
                <input type="text" name="log-in-content-input-username" id="log-in-content-input-username" 
                placeholder="Enter Username or School ID" 
                required>
            </div>
            <div class="input-controller">
                <input type="password" name="log-in-content-input-password" id="log-in-content-input-password"  placeholder="Password...">
                <span class="toggle-password password-show" onclick="togglePasswordVisibility()"></span>
            </div>
            <button type="submit" id="log-in-content-btn-log-in">Log In</button>
            <span id="message"></span>
        </form>
    </div>
    <script> 
    </script>
</body>
</html>
