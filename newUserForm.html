<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User Form</title>
    <link rel="stylesheet" href="css/addUserForm.css">
    <link rel="stylesheet" href="js/addUserForm.js">
</head>
<body>
    <div class="form-content-container">
        <form action="" method="post" class="form-content" id="add-new-user">
            <button type="button" class="btn-add-new-user-close" id="btn-add-new-user-close"></button>
            <div class="form-content-head-text">
                <h1>Add New User</h1>
            </div>
            <div class="form-content-input-field-col">
                <div class="form-content-input-field-row">
                    <div class="form-content-input-field form-content-input-field-username">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-content-input-field form-content-input-field-password">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                        <div class="form-content-input-field-password-hide"></div>
                    </div>
                    <div class="form-content-input-field form-content-input-field-pnumber">
                        <label for="pnumber">Phone Number:</label>
                        <input type="tel" id="pnumber" name="pnumber" required>
                    </div>
                    <div class="form-content-input-field form-content-input-field-role">
                        <label for="role">Role:</label>
                        <input type="text" id="role" name="role" required>
                    </div>
                </div>
                <div class="form-content-input-field-row">
                    <div class="form-content-input-field form-content-input-field-fname">
                        <label for="fname">First Name:</label>
                        <input type="text" id="fname" name="fname" required>
                    </div>
                    <div class="form-content-input-field form-content-input-field-mname">
                        <label for="mname">Middle Name:</label>
                        <input type="text" id="mname" name="mname" required>
                    </div>
                    <div class="form-content-input-field form-content-input-field-lname">
                        <label for="lname">Last Name:</label>
                        <input type="text" id="lname" name="lname" required>
                    </div>
                    <div class="form-content-input-field form-content-input-field-pfp-pic">
                        <label for="pfpPic">Picture:</label>
                        <input type="file" id="pfpPic" name="pfpPic" accept="image/*" required>
                    </div>
                </div>
            </div>
            <div class="form-content-show-pfp-pic">
                <img src="" alt="" id="pfp-pic-img" class="pfp-pic-img">
            </div>
        </form>
    </div> 
    <script>
        const pfppic = document.getElementById('pfpPic'); // image input
        const pfppicoutput = document.getElementById('pfp-pic-img'); // image output
    
        pfppic.addEventListener('change', function() {
            const file = pfppic.files[0]; // Get the selected file
            const fileName = file.name; // Extract the file name
            const fileReader = new FileReader();
    
            fileReader.onload = function() {
                pfppicoutput.src = fileReader.result; // Display the image
            };
    
            fileReader.readAsDataURL(file);
        });
    </script>
</body>
</html>
